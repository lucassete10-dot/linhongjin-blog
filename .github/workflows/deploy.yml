name: Deploy wandor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: Export legacy Supabase content into dist
        # 一次性迁移通道：Actions 令牌无仓库写权限推不了分支，
        # 改为把导出结果随 Pages 发布到 /export/，本地拉取审核后入库。
        # 内容均为旧站已公开发布的文章，不含隐私。失败不影响部署。
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if out=$(node scripts/export-supabase-content.mjs --out dist/export 2>&1); then
            echo "$out"
            echo "export ok:" && ls dist/export
          else
            echo "$out"
            short=$(echo "$out" | tail -c 380 | tr '\n' ' ')
            echo "::warning::legacy export failed: $short"
          fi
      - name: Transcode background video to 1080p
        # 原素材是 4K/17MB：低配设备解码吃力、加载慢时首页会停在底稿画面。
        # 转成 1080p + faststart（边下边播），体积约降到 1/4，几乎秒出。
        run: |
          if [ -f dist/media/wandor-bg.mp4 ]; then
            ffmpeg -hide_banner -loglevel error -y -i dist/media/wandor-bg.mp4 \
              -vf "scale=1920:-2" -c:v libx264 -crf 24 -preset medium -an \
              -movflags +faststart dist/media/wandor-bg-1080.mp4
            mv dist/media/wandor-bg-1080.mp4 dist/media/wandor-bg.mp4
            echo "transcoded:" && ls -la dist/media
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
