name: Export old Supabase content

# 一次性迁移任务（手动触发）：把旧 Help Myself 的已发布文章导出为 Markdown。
# 注意：GITHUB_TOKEN 无仓库写权限时推分支会失败（exit 128），
# 需先在 Settings → Actions → Workflow permissions 开启 Read and write。
# 常规迁移走 deploy.yml 的「Export legacy Supabase content into dist」通道。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export published content
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/export-supabase-content.mjs | tee export.log
      - name: Publish list to job summary
        run: |
          echo "## Supabase 导出结果" >> "$GITHUB_STEP_SUMMARY"
          cat export.log >> "$GITHUB_STEP_SUMMARY"
      - name: Commit to supabase-export branch
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B supabase-export
          git add -f content-import
          git commit -m "chore: 导出 Supabase 旧文章供审核" || echo "nothing to commit"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" supabase-export
      - name: Upload export artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-export
          path: content-import
